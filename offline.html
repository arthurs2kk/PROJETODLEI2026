<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0C326F">
  <title>Sem conexão — Pro Povo</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/Images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/Images/icons/apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; font-family: "Noto Sans", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8f8f8; color: #333; }
    main { width: min(100%, 440px); padding: 32px; text-align: center; border: 1px solid #dbdbdb; border-radius: 16px; background: #fff; box-shadow: 0 12px 36px rgba(12, 50, 111, .12); }
    img { width: 112px; height: 112px; }
    h1 { margin: 18px 0 8px; color: #0c326f; font-size: 26px; }
    p { margin: 0 0 24px; line-height: 1.55; color: #555; }
    button { min-height: 46px; padding: 11px 22px; border: 0; border-radius: 10px; background: #1351b4; color: #fff; font: 700 15px inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffcd07; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      body { background: #101820; color: #f5f5f5; }
      main { background: #172330; border-color: #34495e; }
      h1 { color: #d4e5ff; }
      p { color: #d7dce2; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/Images/icons/icon-192.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>Os relatos, o mapa e o envio de fotos precisam de internet. Verifique sua conexão e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
