<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso restrito — Pro Povo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <script>
  (() => {
    const tema = localStorage.getItem('theme');
    if (tema === 'dark' ||
      (!tema && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
  <link rel="stylesheet" href="../../home.css" />
  <link rel="stylesheet" href="../../css/cssAdm/AdmLogin.css" />
  <link rel="icon" type="image/png" href="../../Images/flavinconProPovo.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/Images/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0C326F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pro Povo">
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script src="../../js/vercel-analytics.js"></script>
  <script defer src="/js/pwa.js"></script>
</head>
<body class="admin-login-page">

  <div class="gov-bar admin-gov-bar">
    <span><i class="ti ti-lock"></i> Área restrita · Acesso exclusivo para funcionários públicos autorizados</span>
  </div>

  <main class="admin-wrapper">
    <div class="admin-card">

      <div class="admin-header">
        <!-- LOGO DA SUA EMPRESA: troque o src pela sua imagem -->
        <div class="admin-logo-area">
          <img src="../../Images/LogoProPovo.png" alt="Logo da empresa" class="admin-logo" />
        </div>
        <h1 class="admin-title">Painel da Prefeitura</h1>
        <p class="admin-subtitle">Pro Povo — Acesso restrito a funcionários autorizados</p>
        <span class="admin-badge"><i class="ti ti-shield-lock"></i> Área restrita</span>
      </div>

      <form class="admin-body" id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin-email">E-mail institucional <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <i class="ti ti-mail input-icon"></i>
            <input type="email" class="form-input with-icon" id="admin-email" name="email" autocomplete="username" required placeholder="seunome@prefeitura.gov.br" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-senha">Senha <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <i class="ti ti-lock input-icon"></i>
            <input type="password" class="form-input with-icon" id="admin-senha" name="password" autocomplete="current-password" required placeholder="Sua senha" />
            <button class="toggle-senha" id="toggle-admin-senha" type="button" aria-label="Mostrar senha">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>

        <p id="admin-login-erro" class="admin-login-erro" role="alert" hidden></p>
        <button type="submit" class="btn-login admin-btn" id="btn-admin-login">
          <i class="ti ti-shield-lock"></i> Acessar painel
        </button>
      </form>

      <div class="admin-footer-note">
        <i class="ti ti-info-circle"></i>
        <p>Esse acesso é exclusivo para funcionários cadastrados pela administração. Cidadãos devem usar a <a href="../userPages/login.html">tela de login comum</a>.</p>
      </div>
    </div>

    <a href="../../index.html" class="admin-voltar"><i class="ti ti-arrow-left"></i> Voltar ao site</a>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/admJS/AdmLogin.js"></script>
  <script src="../../js/theme.js"></script>
<script src="../../js/pagesJS/menu.js"></script>
</body>
</html>
