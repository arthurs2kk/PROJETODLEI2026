<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gráficos — Pro Povo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="relatos.css" />
  <link rel="stylesheet" href="AdminPage.css" />
  <link rel="stylesheet" href="AdminGraficos.css" />
  <link rel="icon" type="image/png" href="Images/flavinconProPovo.png">
</head>
<body>

  <!-- Tela de verificação (evita "flash" de conteúdo antes de confirmar admin) -->
  <div id="verificando" class="verificando-overlay">
    <i class="ti ti-loader-2" style="animation:spin 0.8s linear infinite; font-size:32px; color:var(--azul);"></i>
    <p>Verificando permissão de acesso...</p>
  </div>

  <div id="painel-conteudo" style="display:none;">

    <div class="gov-bar admin-gov-bar">
      <span><i class="ti ti-lock"></i> Área restrita · Painel administrativo</span>
    </div>

    <nav class="navbar">
      <div class="navbar-left">
        <div class="empresa-logo">
          <img src="Images/LogoProPovo.png" alt="Logo da empresa" id="logo-empresa" />
        </div>
        <div class="navbar-divider"></div>
        <div class="logo">
          <div class="logo-text-group">
            <span class="logo-title">Pro Povo</span>
            <span class="logo-sub">Painel administrativo</span>
          </div>
        </div>
      </div>
      <div class="nav-links">
        <a href="AdminPage.html" class="nav-link">Gestão de relatos</a>
        <a href="AdminGraficos.html" class="nav-link active">Gráficos</a>
      </div>
      <div class="nav-btns">
        <span class="admin-user-tag" id="admin-user-tag"><i class="ti ti-user-shield"></i> Carregando...</span>
        <button class="btn-outline" id="btn-sair">Sair</button>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Abrir menu">
        <i class="ti ti-menu-2"></i>
      </button>
    </nav>

    <div class="mobile-menu" id="mobile-menu">
      <span class="admin-user-tag" id="admin-user-tag-mobile" style="justify-content:flex-start; width:fit-content;"><i class="ti ti-user-shield"></i> Carregando...</span>
      <div class="mobile-divider"></div>
      <a href="AdminPage.html" class="mobile-link"><i class="ti ti-list-details"></i> Gestão de relatos</a>
      <a href="AdminGraficos.html" class="mobile-link"><i class="ti ti-chart-bar"></i> Gráficos</a>
      <div class="mobile-divider"></div>
      <button class="btn-outline w100" id="btn-sair-mobile">Sair</button>
    </div>

    <!-- CABEÇALHO -->
    <div class="relatos-header">
      <div class="relatos-header-inner">
        <h1 class="relatos-title"><i class="ti ti-chart-bar"></i> Gráficos e estatísticas</h1>
        <p class="relatos-subtitle">Explore os relatos por cidade, bairro, tipo de problema e status</p>
      </div>
    </div>

    <!-- CONTROLES -->
    <div class="graf-controles">
      <select class="filtro-select" id="grafico-tipo">
        <option value="cidades">Cidades com mais relatos (por habitante)</option>
        <option value="bairros">Bairros com mais relatos (dentro de uma cidade)</option>
        <option value="categorias">Tipos de problema mais comuns</option>
        <option value="status">Status dos relatos</option>
        <option value="evolucao">Evolução mensal de relatos</option>
      </select>

      <select class="filtro-select" id="grafico-filtro-cidade" style="display:none;">
        <option value="">Selecione uma cidade...</option>
      </select>

      <div class="graf-acoes">
        <button class="btn-outline" id="btn-baixar-csv"><i class="ti ti-file-spreadsheet"></i> Baixar dados (CSV)</button>
        <button class="btn-outline" id="btn-baixar-png"><i class="ti ti-download"></i> Baixar gráfico (PNG)</button>
      </div>
    </div>

    <!-- AVISO -->
    <div class="graf-aviso" id="graf-aviso" style="display:none;">
      <div class="graf-aviso-box"><i class="ti ti-info-circle"></i> <span id="graf-aviso-texto"></span></div>
    </div>

    <!-- GRÁFICO -->
    <div class="graf-card">
      <div class="graf-canvas-wrap">
        <canvas id="grafico-canvas"></canvas>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="AdminGraficos.js"></script>
</body>
</html>
