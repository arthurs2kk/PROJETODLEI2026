<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa da Paraíba — Pro Povo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://pro--povo-default-rtdb.firebaseio.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="mapa.css" />
   <link rel="icon" type="image/png" href="Images/flavinconProPovo.png">
</head>
<body>

  <div class="gov-bar">
    <span><i class="ti ti-shield-check"></i> Plataforma cidadã independente · Pro Povo</span>
  </div>

  <nav class="navbar">
    <div class="navbar-left">
      <div class="empresa-logo">
        <img src="Images/LogoProPovo.png" alt="Logo da empresa" id="logo-empresa" />
      </div>
      <div class="navbar-divider"></div>
      <div class="logo">
        <div class="logo-text-group">
          <span class="logo-title">Pro Povo</span>
          <span class="logo-sub">Fale com sua cidade</span>
        </div>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Início</a>
      <a href="relatos.html" class="nav-link">Relatos</a>
      <a href="mapa.html" class="nav-link active">Mapa</a>
      <a href="meus-relatos.html" class="nav-link" id="nav-meus-relatos" style="display:none;">Meus relatos</a>
    </div>
    <div class="nav-btns">
      <button class="btn-outline" id="btn-entrar">Entrar</button>
      <button class="btn-primary" id="btn-cadastrar">Criar conta</button>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Abrir menu">
      <i class="ti ti-menu-2"></i>
    </button>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html" class="mobile-link"><i class="ti ti-home"></i> Início</a>
    <a href="relatos.html" class="mobile-link"><i class="ti ti-list"></i> Relatos</a>
    <a href="mapa.html" class="mobile-link"><i class="ti ti-map-2"></i> Mapa</a>
    <a href="meus-relatos.html" class="mobile-link" id="mobile-meus-relatos" style="display:none;"><i class="ti ti-user-check"></i> Meus relatos</a>
  </div>

  <!-- CABEÇALHO -->
  <div class="mapa-header">
    <div class="mapa-header-inner">
      <h1 class="mapa-title"><i class="ti ti-map-2"></i> Mapa da Paraíba</h1>
      <p class="mapa-subtitle">Veja onde estão os problemas relatados pelos cidadãos paraibanos</p>

      <div class="mapa-legenda">
        <span class="legenda-item"><span class="dot dot-buraco"></span> Buraco</span>
        <span class="legenda-item"><span class="dot dot-ilum"></span> Iluminação</span>
        <span class="legenda-item"><span class="dot dot-lixo"></span> Lixo</span>
        <span class="legenda-item"><span class="dot dot-agua"></span> Água/Esgoto</span>
        <span class="legenda-item"><span class="dot dot-outros"></span> Outros</span>
      </div>
    </div>
  </div>

  <!-- MAPA -->
  <div class="mapa-wrapper">
    <div id="mapa-container"></div>
    <p class="mapa-contagem" id="mapa-contagem">Carregando relatos...</p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="mapa.js"></script>
</body>
</html>
